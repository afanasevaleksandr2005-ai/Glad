; Пример конфига extDB3 для донат-магазина «Грань войны».
;
; ВНИМАНИЕ: точный синтаксис CUSTOM-протокола (SQL1_1, "Number of Inputs" и
; т.п.) отличается между версиями/форками extDB3. Сверьтесь с документацией
; вашей сборки extDB3 перед боевым использованием — здесь показана логика
; запросов, а не гарантированно точный ini-синтаксис вашей версии.
;
; Файл кладётся туда, куда его ищет @extDB3 (обычно
; <ServerProfile>/extdb3-conf.ini), путь передаётся в missionNamespace через
; параметр extDB3 при старте расширения.

[extDB3]
Version = 2

[Database]
Type      = MySQL
Name      = grany_voyny_site        ; та же БД, что и у сайта, либо реплика
Username  = arma_donate_reader      ; отдельный юзер с минимальными правами:
                                     ; SELECT на donate_orders/*_configs,
                                     ; UPDATE только на delivery_status/delivered_at
Password  = CHANGE_ME
IP        = 127.0.0.1
Port      = 3306

; Забирает оплаченные, но ещё не выданные заказы на оружие для игрока.
[SQL_CUSTOM_donate_weapon_check]
Mode = CUSTOM
Default:
  SQL1_1 = SELECT o.id, w.base_id, w.optic_id, w.muzzle_id, w.bipod_id
           FROM donate_orders o
           JOIN donate_weapon_configs w ON w.order_id = o.id
           WHERE o.steam_uid = ?
             AND o.item_type = 'weapon'
             AND o.payment_status = 'paid'
             AND o.delivery_status = 'awaiting';

; Забирает оплаченные, но ещё не выданные заказы на форму для игрока.
[SQL_CUSTOM_donate_uniform_check]
Mode = CUSTOM
Default:
  SQL1_1 = SELECT o.id, u.uniform_id, u.vest_id, u.backpack_id, u.headgear_id
           FROM donate_orders o
           JOIN donate_uniform_configs u ON u.order_id = o.id
           WHERE o.steam_uid = ?
             AND o.item_type = 'uniform'
             AND o.payment_status = 'paid'
             AND o.delivery_status = 'awaiting';

; Помечает заказ выданным. Вызывается ПОСЛЕ успешной выдачи предмета в SQF —
; никогда до, иначе при обрыве соединения игрок потеряет оплаченный предмет.
[SQL_CUSTOM_donate_mark_delivered]
Mode = CUSTOM
Default:
  SQL1_1 = UPDATE donate_orders
           SET delivery_status = 'delivered', delivered_at = NOW()
           WHERE id = ? AND delivery_status = 'awaiting';
